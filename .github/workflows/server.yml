name: Deploy the server to Railway

# ═══ WHAT HAPPENED, AND WHAT THIS FILE IS FOR NOW ═══
#
# Railway deploys the server itself, from its own GitHub integration. It did
# it on the 19th of October, and then it did not do it again until the 25th —
# six days and eleven commits, with nobody told. Checked afterwards against
# the deployment list GitHub keeps:
#
#   19 Oct   64b32bf   …and then nothing
#   25 Oct   0ccb624   and every push since
#
# That gap is what the bot matches were paid out of. The browser had the
# arena ground bonus and the fix that carries a card's LEVEL into the server's
# replay; the server had neither, so the two replayed the same match
# differently and Or was charged four trophies for a match he had just won —
# twice, in opposite directions.
#
# So this file is TWO things, and neither of them is the usual deploy:
#
#   1. A WATCHDOG, which runs every morning and fails loudly if the server is
#      not running what main says it should be. That is the alarm that was
#      missing; six days of silence should not have been possible.
#
#   2. A FALLBACK deploy, which does nothing at all unless a RAILWAY_TOKEN
#      secret exists. Arming it while Railway's own integration is connected
#      means both of them deploy the same commit — harmless and wasteful — so
#      it is for the day the integration stops again, not for today.
#
# To arm it: Railway → the project → Settings → Tokens → a PROJECT token for
# the production environment; then GitHub → the repo → Settings → Secrets and
# variables → Actions → a secret called RAILWAY_TOKEN. Nothing else.

on:
  push:
    branches: [main]
    # Only what the server actually runs. A change to the client's CSS does
    # not need a server deploy.
    paths:
      - "apps/server/**"
      - "packages/**"
      - "data/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/server.yml"
  # Every morning at 09:00 in Israel, for the watchdog below.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# One deploy at a time, and a queued one WAITS rather than cancelling the one
# in flight — the same reasoning as the Pages workflow, where cancelling left
# three commits stranded.
concurrency:
  group: railway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══ IS THE SERVER RUNNING WHAT WE THINK IT IS? ═══
  #
  # One request, and the only reason it can be asked at all is that the
  # health check prints its commit now. Red here means the server has fallen
  # behind main — which is the condition that cost a day, and which nothing
  # was watching.
  #
  # Deliberately a FAILURE and not a warning: a failed scheduled run emails
  # Or, and that is the whole point of it existing.
  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the server which commit it is running
        env:
          URL: ${{ vars.SERVER_URL || 'https://amanda-server-production.up.railway.app' }}
        run: |
          want="$(git rev-parse --short=7 HEAD)"
          said="$(curl -fsS --max-time 25 "$URL" || echo 'no answer')"
          echo "main is at $want"
          echo "the server says: $said"
          case "$said" in
            *"$want"*)
              echo "::notice title=The server is up to date::$want"
              ;;
            *)
              echo "::error title=The server is behind::main is at $want and the server said \"$said\". Railway has probably stopped deploying — check the project's GitHub integration, or add a RAILWAY_TOKEN secret to let this workflow do it."
              exit 1
              ;;
          esac

  # ═══ THE FALLBACK ═══
  #
  # Everything below is skipped — in one four-second job, with no red tick
  # and no annotation — until the secret exists. A warning on every single
  # push is the best way there is to teach everybody to ignore warnings.
  armed:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN: Railway's own GitHub integration is deploying this. See the top of this file."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  # Nothing reaches the server that does not typecheck and pass, for exactly
  # the reasons written out in deploy.yml. The server is the half that holds
  # the database and decides who won.
  check:
    needs: armed
    if: needs.armed.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm --filter @amanda/engine test -- --run
      - run: pnpm --filter @amanda/server test -- --run

  deploy:
    needs: [armed, check]
    if: needs.armed.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # `railway up` streams the build and waits for it. Twenty minutes is far
    # more than this build takes; it is here so a hung upload ends as a
    # failure rather than as a runner sitting there for six hours.
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The name in Railway. A repo variable so it can change without a commit.
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'amanda-server' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned on purpose: this workflow is built on the flags this version
      # has. `railway up` on a newer CLI that renamed one of them would fail
      # on a Tuesday for no reason anybody could see.
      - name: Install the Railway CLI
        run: npm install -g @railway/cli@5.71.0

      # Railway fills in its own RAILWAY_GIT_COMMIT_SHA for deploys IT
      # triggers from GitHub; a deploy pushed from here has to say so itself,
      # or the watchdog above has nothing to read. `--skip-deploys` so setting
      # it does not start a deploy of the OLD code a second before `railway
      # up` starts one of the new.
      - name: Tell the server which commit it is
        continue-on-error: true
        run: railway variable set "GIT_COMMIT_SHA=$GITHUB_SHA" --service "$RAILWAY_SERVICE" --skip-deploys

      # No `-y`. On a cold or unlinked run that flag makes `up` CREATE a new
      # project rather than deploy to the existing one, and a second Railway
      # project nobody meant to make is a worse day than a failed deploy.
      - name: Deploy
        run: railway up --ci --service "$RAILWAY_SERVICE"
