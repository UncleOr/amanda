name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ═══ cancel-in-progress MUST be false here ═══
#
# It was true, and three deploys in a row failed with "Deployment request
# failed due to in progress deployment". Cancelling the workflow run does NOT
# cancel the Pages deployment GitHub has already started on its side — so the
# next run arrived, found that deployment still going, and died. Three commits
# never reached the site; the fourth happened to carry them.
#
# With false, a queued run WAITS instead. GitHub also drops any run queued
# between the one in flight and the newest, so a burst of pushes still ends
# with the latest commit live — it just gets there without failing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 20 is deprecated on the runners and already being forced to 24.
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @amanda/client build
        env:
          # Set this repo variable (Settings → Secrets and variables → Actions →
          # Variables) to your deployed server, e.g. wss://amanda-server.onrender.com,
          # to enable the "Online" button on the public site.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          # ═══ / AND NOT /amanda/ ═══
          #
          # The site answers on playamanda.com now, and a TWA is verified
          # against a whole ORIGIN: Chrome fetches
          # https://playamanda.com/.well-known/assetlinks.json and nothing
          # else will do. On uncleor.github.io/amanda/ that file would have to
          # live at the root of uncleor.github.io — a different repository,
          # shared with every other project on the account.
          #
          # public/CNAME is what keeps the custom domain across deploys: this
          # workflow replaces the published site wholesale every time, and a
          # domain set only in Settings has a habit of coming back as a blank
          # field after one of those.
          VITE_BASE_PATH: /play/
      # ═══ TWO THINGS AT ONE ORIGIN ═══
      #
      # The domain's front door is a landing page; the game lives under
      # /play/. They are published together as one site, so the artifact is
      # assembled rather than taken straight from the Vite build.
      #
      # web/.well-known/assetlinks.json HAS to end up at the ROOT. Chrome
      # fetches it from https://playamanda.com/.well-known/assetlinks.json and
      # nowhere else, whatever path the app itself is served from — which is
      # exactly why those files were moved out of the client's public/ folder,
      # where they would now be published under /play/ and verify nothing.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r web/. site/
          mkdir -p site/play
          cp -r apps/client/dist/. site/play/
          test -f site/.well-known/assetlinks.json
          test -f site/CNAME
          test -f site/index.html
          test -f site/play/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
