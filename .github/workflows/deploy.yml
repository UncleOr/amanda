name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ═══ cancel-in-progress MUST be false here ═══
#
# It was true, and three deploys in a row failed with "Deployment request
# failed due to in progress deployment". Cancelling the workflow run does NOT
# cancel the Pages deployment GitHub has already started on its side — so the
# next run arrived, found that deployment still going, and died. Three commits
# never reached the site; the fourth happened to carry them.
#
# With false, a queued run WAITS instead. GitHub also drops any run queued
# between the one in flight and the newest, so a burst of pushes still ends
# with the latest commit live — it just gets there without failing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 20 is deprecated on the runners and already being forced to 24.
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @amanda/client build
        env:
          # Set this repo variable (Settings → Secrets and variables → Actions →
          # Variables) to your deployed server, e.g. wss://amanda-server.onrender.com,
          # to enable the "Online" button on the public site.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          # GitHub Pages serves this project from a subpath; Vercel and any
          # root domain serve it from /, which is the config default.
          VITE_BASE_PATH: /amanda/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
