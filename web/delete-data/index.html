<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מחיקת מידע | אמנדה</title>
    <!--
      /delete is the one address for both answers — account deletion and
      data deletion without it. This path was in Play Console for an hour, so
      it stays rather than dead-ending.

      A meta refresh, not JavaScript: GitHub Pages serves static files and
      cannot send a 301, and a page about deleting your data should not need
      scripting to work.
    -->
    <link rel="canonical" href="https://playamanda.com/delete/" />
    <meta http-equiv="refresh" content="0; url=/delete/" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070a12;
        color: #e7ecf5;
        font-family: Rubik, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      a { color: #ffb020; }
    </style>
  </head>
  <body>
    <p>הדף נמצא ב<a href="/delete/">playamanda.com/delete</a></p>
  </body>
</html>
