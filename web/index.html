<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אמנדה | משחק קלפים מפלצתי</title>
    <meta
      name="description"
      content="בונים לוח של מפלצות, ואז הן נלחמות לבד. אמנדה שופטת, אמנדה אוכלת."
    />
    <link rel="icon" href="/play/favicon-32.png" />
    <meta property="og:title" content="אמנדה | משחק קלפים מפלצתי" />
    <meta property="og:description" content="בונים לוח של מפלצות, ואז הן נלחמות לבד." />
    <meta property="og:image" content="/play/brand/amanda_banner.webp" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Beastly&family=Rubik:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <!--
      ═══ THIS PAGE IS A PLACEHOLDER, AND THE WORDS ARE OR'S ═══

      The game moved to /play/ so that the domain's front door can be a front
      door: store badges, the theme song, a trailer, something to send people.
      That page does not exist yet. This one holds the spot, sends anyone who
      arrives into the game, and is meant to be replaced rather than extended.

      Deliberately one file with no build step: it has to keep working on the
      day the rest of the toolchain is being changed.
    -->
    <style>
      :root {
        --bg: #070a12;
        --text: #e7ecf5;
        --muted: #93a0bd;
        --accent: #ffb020;
        --line: rgba(255, 255, 255, 0.12);
        /* The game's own type scale — see .claude/skills/amanda-ui/SKILL.md */
        --t-2: clamp(11.5px, 3vh, 14px);
        --t-3: clamp(13px, 3.6vh, 16px);
        --t-4: clamp(16px, 4.6vh, 21px);
        --t-6: clamp(34px, 9vh, 72px);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: Rubik, system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .wrap { width: min(680px, 100%); text-align: center; }
      /* Stacked, the picture is capped so the button is never pushed under
         the fold — it is the only thing on this page that has to be found. */
      .art { max-height: 46dvh; }
      .art {
        width: 100%;
        aspect-ratio: 1376 / 768;
        border-radius: 18px;
        border: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(7, 10, 18, 0.15), rgba(7, 10, 18, 0.8)),
          url("/play/brand/amanda_banner.webp") center / cover no-repeat;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
      }
      h1 {
        font-family: "Rubik Beastly", Rubik, system-ui, sans-serif;
        font-size: var(--t-6);
        margin: 18px 0 6px;
        color: var(--accent);
        letter-spacing: 0.01em;
      }
      .tag { margin: 0 0 26px; font-size: var(--t-3); color: var(--text); }
      /* The hero. One thing, two steps of the scale above everything else. */
      .play {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 16px 44px;
        border-radius: 14px;
        border: 1px solid #ffd36b;
        background: linear-gradient(180deg, #ffe9a8, #f0c24a);
        color: #241a05;
        font: inherit;
        font-size: var(--t-4);
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(255, 176, 32, 0.28);
      }
      .play:hover { filter: brightness(1.06); }
      .soon {
        margin: 26px 0 0;
        font-size: var(--t-2);
        color: var(--muted);
      }
      footer { margin-top: 22px; font-size: var(--t-2); }
      footer a { color: var(--muted); text-decoration: none; }
      footer a:hover { color: var(--text); }
      /*
       * ═══ A PHONE HELD SIDEWAYS ═══
       *
       * Or, on his: *"Amanda's picture fills the whole screen, and then I
       * scrolled down and saw buttons. A reasonable person would just assume
       * it was stuck."* Measured at 844x390: the art came out 680x380 — the
       * entire screen — and "play now" sat at y=521, a hundred and thirty-one
       * pixels below the fold. I checked this page at 900x720 and never once
       * on a phone, which is the exact thing I measure every other screen for.
       *
       * Landscape is WIDE. Below 560px of height it stops stacking and stands
       * the art beside the words, and nothing scrolls at any size.
       */
      @media (max-height: 560px) and (min-width: 640px) {
        body { padding: 14px 18px; }
        .wrap {
          width: min(980px, 100%);
          display: grid;
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
          align-items: center;
          column-gap: 24px;
          text-align: start;
        }
        .art { grid-row: 1 / span 5; max-height: none; }
        /* A grid item stretches; an inline-flex button in a column becomes a
           bar the width of the column. It wants to be button-shaped. */
        .play { justify-self: start; }
        h1 { margin: 0; }
        .tag { margin: 6px 0 16px; }
        .soon { margin: 14px 0 0; }
        footer { margin-top: 10px; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .wrap { animation: rise 0.5s ease-out; }
        @keyframes rise {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: none; }
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="art" role="img" aria-label="אמנדה, הדרקון והאריה"></div>
      <h1>אמנדה</h1>
      <p class="tag">בונים לוח של מפלצות, ואז הן נלחמות לבד.</p>
      <a class="play" href="/play/">לשחק עכשיו</a>
      <!-- TODO(Or): store badges and the theme song go here once the app ships. -->
      <p class="soon">בקרוב גם בגוגל פליי</p>
      <footer><a href="/play/?legal=privacy">פרטיות</a></footer>
    </main>
  </body>
</html>
