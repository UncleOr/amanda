<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מחיקת החשבון | אמנדה</title>
    <!--
      The page moved to /delete-data, because that is the address Or entered
      in Play Console and a URL in a store listing is harder to change than a
      file here. This stays so the shorter one never dead-ends: it was live
      and linked for an hour, and a deletion page that 404s is worse than one
      that never existed.

      A meta refresh rather than a JavaScript redirect — GitHub Pages serves
      static files and cannot send a 301, and a page about deleting your data
      should not need scripting to work.
    -->
    <link rel="canonical" href="https://playamanda.com/delete-data/" />
    <meta http-equiv="refresh" content="0; url=/delete-data/" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070a12;
        color: #e7ecf5;
        font-family: Rubik, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      a { color: #ffb020; }
    </style>
  </head>
  <body>
    <p>הדף עבר ל<a href="/delete-data/">playamanda.com/delete-data</a></p>
  </body>
</html>
